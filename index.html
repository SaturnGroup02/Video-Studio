<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GROK Typography Motion — 15s</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050505;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      will-change: opacity, transform;
    }

    .scene.active { opacity: 1; pointer-events: auto; }

    /* ===== SCENE 1: Spiral + Icon (2.0s) ===== */
    .spiral-container {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spiral {
      position: absolute;
      inset: 0;
      border: 2px solid transparent;
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }
    .spiral:nth-child(2) {
      inset: 18px;
      border-top-color: #7b61ff;
      animation-duration: 0.85s;
      animation-direction: reverse;
    }
    .spiral:nth-child(3) {
      inset: 36px;
      border-top-color: #ff2d55;
      animation-duration: 0.65s;
    }

    .icon-core {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.45);
      animation: pulse 0.9s ease-in-out infinite alternate;
      z-index: 2;
    }
    .icon-core img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      from { transform: scale(0.92); opacity: 0.85; }
      to   { transform: scale(1.08); opacity: 1; }
    }

    .scene1-text {
      margin-top: 36px;
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #777;
      opacity: 0;
      animation: fadeUp 0.5s 0.25s forwards;
    }

    /* ===== SCENE 2: Big Logo + Icon (2.0s) ===== */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.35);
      transform: scale(0.5);
      opacity: 0;
    }
    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-big {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(3.8rem, 16vw, 8.2rem);
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 45%, #38bdf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transform: scale(0.55);
      opacity: 0;
      filter: blur(14px);
    }

    .scene2.active .logo-icon {
      animation: logoPop 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .scene2.active .logo-big {
      animation: logoPop 0.85s 0.08s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes logoPop {
      0%   { transform: scale(0.4); opacity: 0; filter: blur(18px); }
      65%  { transform: scale(1.06); opacity: 1; filter: blur(0); }
      100% { transform: scale(1); opacity: 1; filter: blur(0); }
    }

    .sub-logo {
      margin-top: 14px;
      font-size: 0.95rem;
      letter-spacing: 7px;
      color: #666;
      opacity: 0;
    }
    .scene2.active .sub-logo {
      animation: fadeUp 0.45s 0.45s forwards;
    }

    /* ===== SCENE 3: Morph around icon (2.4s) ===== */
    .morph-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .morph-box {
      position: absolute;
      width: 160px;
      height: 160px;
      background: #3b82f6;
      border-radius: 12px;
      z-index: 1;
    }

    .morph-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      overflow: hidden;
      z-index: 3;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      opacity: 0;
    }
    .morph-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scene3.active .morph-box {
      animation: morphShape 2.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .scene3.active .morph-icon {
      animation: fadeScale 0.5s 0.15s forwards;
    }

    @keyframes morphShape {
      0% {
        border-radius: 12px;
        width: 160px; height: 160px;
        transform: rotate(0deg) scale(1);
        background: #3b82f6;
        box-shadow: none;
      }
      28% {
        border-radius: 50%;
        width: 180px; height: 180px;
        transform: rotate(90deg) scale(1.08);
        background: #6366f1;
      }
      52% {
        border-radius: 50%;
        width: 150px; height: 150px;
        transform: rotate(180deg) scale(0.95);
        background: #8b5cf6;
        box-shadow: inset 0 0 0 38px #0a0a0a;
      }
      78% {
        border-radius: 50%;
        width: 190px; height: 190px;
        transform: rotate(270deg) scale(1.02);
        background: #a855f7;
        box-shadow: inset 0 0 0 52px #0a0a0a;
      }
      100% {
        border-radius: 50%;
        width: 170px; height: 170px;
        transform: rotate(360deg) scale(1);
        background: #c084fc;
        box-shadow: inset 0 0 0 45px #0a0a0a;
      }
    }

    @keyframes fadeScale {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .morph-label {
      position: absolute;
      bottom: 14%;
      font-size: 12px;
      letter-spacing: 3px;
      color: #999;
      opacity: 0;
    }
    .scene3.active .morph-label {
      animation: fadeUp 0.4s 0.2s forwards;
    }

    /* ===== SCENE 4: Dot Grid (2.0s) ===== */
    .dot-grid {
      display: grid;
      grid-template-columns: repeat(12, 9px);
      gap: 13px;
      transform: scale(0.85);
    }
    .dot {
      width: 7px;
      height: 7px;
      background: #3b82f6;
      border-radius: 50%;
      opacity: 0.25;
    }
    .scene4.active .dot {
      animation: dotWave 1.7s ease-in-out forwards;
    }
    @keyframes dotWave {
      0%   { opacity: 0.15; transform: scale(0.4); }
      35%  { opacity: 1; transform: scale(1.5); background: #60a5fa; }
      65%  { opacity: 0.85; transform: scale(1); background: #93c5fd; }
      100% { opacity: 0.5; transform: scale(0.85); }
    }

    /* ===== SCENE 5: EASE + Icon (1.8s) ===== */
    .pattern-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .wave-line {
      position: absolute;
      width: 220%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff2d55, #00d4ff, transparent);
      border-radius: 3px;
      opacity: 0.65;
    }
    .scene5.active .wave-line {
      animation: waveMove 1.5s ease-in-out infinite;
    }
    @keyframes waveMove {
      0%   { transform: translateX(-55%) scaleY(1); }
      50%  { transform: translateX(0%) scaleY(2.8); }
      100% { transform: translateX(55%) scaleY(1); }
    }

    .ease-row {
      display: flex;
      align-items: center;
      gap: 22px;
      z-index: 2;
    }

    .ease-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.5);
    }
    .ease-icon img { width: 100%; height: 100%; object-fit: cover; }

    .big-word {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(3.2rem, 14vw, 7.5rem);
      letter-spacing: -0.03em;
      text-shadow: 0 0 40px rgba(0, 212, 255, 0.35);
      opacity: 0;
      transform: scale(1.6) rotate(-3deg);
      filter: blur(8px);
    }

    .scene5.active .ease-icon {
      animation: logoPop 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .scene5.active .big-word {
      animation: wordSlam 0.65s 0.05s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes wordSlam {
      to { transform: scale(1) rotate(0); opacity: 1; filter: blur(0); }
    }

    /* ===== SCENE 6: Fast Typo (2.0s) ===== */
    .typo-seq {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .typo-item {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(1.9rem, 7.5vw, 4.2rem);
      letter-spacing: -0.02em;
      opacity: 0;
      transform: translateY(28px);
    }
    .scene6.active .typo-item:nth-child(1) { animation: typoIn 0.4s 0.04s cubic-bezier(0.16,1,0.3,1) forwards; color: #60a5fa; }
    .scene6.active .typo-item:nth-child(2) { animation: typoIn 0.4s 0.22s cubic-bezier(0.16,1,0.3,1) forwards; color: #a78bfa; }
    .scene6.active .typo-item:nth-child(3) { animation: typoIn 0.4s 0.40s cubic-bezier(0.16,1,0.3,1) forwards; color: #f472b6; }
    .scene6.active .typo-item:nth-child(4) { animation: typoIn 0.4s 0.58s cubic-bezier(0.16,1,0.3,1) forwards; color: #34d399; }
    @keyframes typoIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== SCENE 7: Final (2.8s) ===== */
    .final-wrap { text-align: center; }

    .final-icon {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      margin: 0 auto 20px;
      box-shadow: 0 0 50px rgba(99, 102, 241, 0.4);
      opacity: 0;
      transform: scale(0.5);
    }
    .final-icon img { width: 100%; height: 100%; object-fit: cover; }

    .final-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.8rem, 11vw, 5.5rem);
      letter-spacing: -0.03em;
      opacity: 0;
      transform: translateY(18px);
    }

    .scene7.active .final-icon {
      animation: logoPop 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .scene7.active .final-logo {
      animation: fadeUp 0.55s 0.25s forwards;
    }

    .final-sub {
      margin-top: 14px;
      font-size: 0.9rem;
      letter-spacing: 3.5px;
      color: #888;
      opacity: 0;
    }
    .scene7.active .final-sub {
      animation: fadeUp 0.45s 0.45s forwards;
    }

    .final-tag {
      margin-top: 22px;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: #444;
      opacity: 0;
    }
    .scene7.active .final-tag {
      animation: fadeUp 0.4s 0.7s forwards;
    }

    /* Utils */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .progress {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #00d4ff, #7b61ff, #ff2d55);
      width: 0%;
      z-index: 100;
      transition: width 0.08s linear;
    }

    .wm {
      position: fixed;
      top: 16px;
      right: 20px;
      font-size: 11px;
      color: #555;
      letter-spacing: 1px;
      z-index: 50;
      font-family: monospace;
    }

    .top-label {
      position: fixed;
      top: 16px;
      left: 20px;
      font-size: 11px;
      color: #666;
      letter-spacing: 2px;
      z-index: 50;
      font-family: monospace;
    }

    .time-label {
      position: fixed;
      bottom: 14px;
      right: 18px;
      font-size: 11px;
      color: #444;
      font-family: monospace;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div class="top-label">GROK · MOTION · 15s</div>
  <div class="wm">@grok.xai</div>
  <div class="time-label" id="timeLabel">0.0s</div>
  <div class="progress" id="progress"></div>

  <div class="stage" id="stage">
    <!-- 1. Spiral + icon  2.0s -->
    <div class="scene scene1" data-duration="2000">
      <div class="spiral-container">
        <div class="spiral"></div>
        <div class="spiral"></div>
        <div class="spiral"></div>
        <div class="icon-core">
          <img src="grok.png" alt="Grok">
        </div>
      </div>
      <div class="scene1-text">INITIALIZING</div>
    </div>

    <!-- 2. Big GROK + icon  2.0s -->
    <div class="scene scene2" data-duration="2000">
      <div class="logo-row">
        <div class="logo-icon">
          <img src="grok.png" alt="Grok">
        </div>
        <div class="logo-big">GROK</div>
      </div>
      <div class="sub-logo">xAI</div>
    </div>

    <!-- 3. Morph  2.4s -->
    <div class="scene scene3" data-duration="2400">
      <div class="morph-wrap">
        <div class="morph-box"></div>
        <div class="morph-icon">
          <img src="grok.png" alt="Grok">
        </div>
      </div>
      <div class="morph-label">SHAPE → FORM → SPACE</div>
    </div>

    <!-- 4. Dot grid  2.0s -->
    <div class="scene scene4" data-duration="2000">
      <div class="dot-grid" id="dotGrid"></div>
    </div>

    <!-- 5. EASE  1.8s -->
    <div class="scene scene5" data-duration="1800">
      <div class="pattern-wrap">
        <div class="wave-line" style="top: 28%; animation-delay: 0s;"></div>
        <div class="wave-line" style="top: 48%; animation-delay: 0.18s; background: linear-gradient(90deg, transparent, #7b61ff, #00d4ff, transparent);"></div>
        <div class="wave-line" style="top: 68%; animation-delay: 0.36s;"></div>
      </div>
      <div class="ease-row">
        <div class="ease-icon">
          <img src="grok.png" alt="Grok">
        </div>
        <div class="big-word">EASE</div>
      </div>
    </div>

    <!-- 6. Typo sequence  2.0s -->
    <div class="scene scene6" data-duration="2000">
      <div class="typo-seq">
        <div class="typo-item">FAST</div>
        <div class="typo-item">MOTION</div>
        <div class="typo-item">TYPO</div>
        <div class="typo-item">∞</div>
      </div>
    </div>

    <!-- 7. Final  2.8s  (total = 15.0s) -->
    <div class="scene scene7" data-duration="2800">
      <div class="final-wrap">
        <div class="final-icon">
          <img src="grok.png" alt="Grok">
        </div>
        <div class="final-logo">GROK</div>
        <div class="final-sub">UNDERSTAND THE UNIVERSE</div>
        <div class="final-tag">CSS × HTML  ·  15s LOOP</div>
      </div>
    </div>
  </div>

  <script>
    // Generate dots
    const grid = document.getElementById('dotGrid');
    for (let i = 0; i < 144; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.animationDelay = (i % 12) * 0.012 + Math.floor(i / 12) * 0.018 + 's';
      grid.appendChild(d);
    }

    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progress = document.getElementById('progress');
    const timeLabel = document.getElementById('timeLabel');
    let totalDuration = 0;
    scenes.forEach(s => totalDuration += parseInt(s.dataset.duration, 10));

    function showScene(index) {
      scenes.forEach((s, i) => s.classList.toggle('active', i === index));
    }

    function run() {
      let sceneIndex = -1;
      const start = performance.now();

      function tick() {
        const now = performance.now();
        const t = (now - start) % totalDuration;
        timeLabel.textContent = (t / 1000).toFixed(1) + 's';
        progress.style.width = (t / totalDuration * 100) + '%';

        let acc = 0;
        let idx = 0;
        for (let i = 0; i < scenes.length; i++) {
          const d = parseInt(scenes[i].dataset.duration, 10);
          if (t < acc + d) { idx = i; break; }
          acc += d;
        }
        if (idx !== sceneIndex) {
          sceneIndex = idx;
          showScene(sceneIndex);
        }
        requestAnimationFrame(tick);
      }

      showScene(0);
      requestAnimationFrame(tick);
    }

    const img = new Image();
    img.src = 'grok.png';
    img.onload = () => setTimeout(run, 150);
    img.onerror = () => setTimeout(run, 150);
  </script>
</body>
</html>
